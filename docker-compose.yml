services:
  postgres:
    image: postgres:16-alpine
    container_name: gobeyond-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gobeyond_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gobeyond_password}
      POSTGRES_DB: ${POSTGRES_DB:-gobeyond_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./devops/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gobeyond_user} -d $${POSTGRES_DB:-gobeyond_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gobeyond-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gobeyond-backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gobeyond_user}:${POSTGRES_PASSWORD:-gobeyond_password}@postgres:5432/${POSTGRES_DB:-gobeyond_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-local_dev_secret_key_change_in_prod}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_sandbox}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_test_secret_sandbox}
      - RAZORPAY_SANDBOX_MODE=true
      - OTP_SANDBOX_MODE=true
      - SMS_PROVIDER=mock
      - EMAIL_PROVIDER=mock
      - PUSH_PROVIDER=mock
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"

volumes:
  postgres_data:
