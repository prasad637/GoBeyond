global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus_rules.yml

# NOTE: Alertmanager is not provisioned in local Docker Compose.
# Rules evaluate in Prometheus (/rules and /alerts UI/API); attach an external
# Alertmanager (`alerting.alertmanagers`) when enabling PagerDuty/Slack/email alerts.

scrape_configs:
  - job_name: 'gobeyond-backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:8000']
        labels:
          application: 'gobeyond-api'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
