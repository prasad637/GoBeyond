  name: gobeyond-secrets
  namespace: gobeyond
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<REPLACE_WITH_STRONG_DB_PASSWORD>"
  DATABASE_URL: "postgresql://gobeyond_user:<REPLACE_WITH_STRONG_DB_PASSWORD>@gobeyond-postgres-service:5432/gobeyond_db"
  SECRET_KEY: "<REPLACE_WITH_OPENSSL_RAND_BASE64_48>"
