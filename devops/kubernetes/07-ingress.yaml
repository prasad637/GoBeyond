apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gobeyond-ingress
  namespace: gobeyond
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://gobeyond.local,http://gobeyond.local"
    # Prevent client navigation aborts on /_next/image from stalling Next.js 14.2.18 image batcher:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_ignore_client_abort on;
    # Security note: `/metrics` and `/health/detailed` stay internal-only because `/metrics` is NOT
    # routed to `gobeyond-backend-service` here. Keep Prometheus scraping Pod IPs inside the cluster.
    # For production TLS termination, create TLS secret `gobeyond-tls`, switch host, and set ssl-redirect: "true":
    # spec.tls: [{ hosts: [gobeyond.example.com], secretName: gobeyond-tls }]
spec:
  rules:
    - host: gobeyond.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gobeyond-backend-service
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gobeyond-backend-service
                port:
                  number: 8000
          - path: /health/ready
            pathType: Exact
            backend:
              service:
                name: gobeyond-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gobeyond-frontend-service
                port:
                  number: 3000
